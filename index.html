<!DOCTYPE html>
<html lang="en-PH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Free Consultation | MRTC App Lab</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --navy: #0A2540;
    --blue: #2563EB;
    --ink: #0F1B2D;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', sans-serif;
    color:var(--ink);
    background:transparent;
    -webkit-font-smoothing:antialiased;
  }
  ul{list-style:none;}

  .booking-section{ padding:64px 0; }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 28px; }

  .booking{
    background:linear-gradient(135deg, var(--navy) 0%, #0F3A66 100%);
    border-radius:28px;
    padding:52px;
    display:grid;
    grid-template-columns:.85fr 1.15fr;
    gap:44px;
    color:#fff;
  }
  .booking .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    color:#9FC1FF;
  }
  .booking .eyebrow::before{
    content:""; width:16px; height:2px; background:#9FC1FF; display:inline-block;
  }
  .booking h2{
    font-family:'Sora', sans-serif; font-weight:700;
    letter-spacing:-0.01em; line-height:1.12;
    font-size:clamp(26px,3.4vw,38px);
    color:#fff;
    margin:14px 0;
  }
  .booking p{ color:#C3D4EE; font-size:16.5px; line-height:1.6; }

  .booking-checklist{ margin-top:24px; display:flex; flex-direction:column; gap:10px; }
  .booking-checklist li{
    font-size:14px; font-weight:600; color:#DCE7FF;
    padding-left:22px; position:relative;
  }
  .booking-checklist li::before{
    content:"✓"; position:absolute; left:0; color:#7CD992; font-weight:800;
  }

  .booking-frame{
    background:#fff; border-radius:20px; padding:6px; overflow:hidden;
    box-shadow:0 24px 50px rgba(3,15,32,.35);
  }
  .booking-frame iframe{
    width:100%; min-height:780px; border:none; overflow:hidden;
    border-radius:14px; display:block;
  }

  @media (max-width: 940px){
    .booking{ grid-template-columns:1fr; padding:32px; gap:32px; }
  }
  @media (max-width: 600px){
    .booking-section{ padding:40px 0; }
    .wrap{ padding:0 16px; }
    .booking{ padding:24px; border-radius:20px; }
  }
</style>
</head>
<body>

<section class="booking-section" id="booking">
  <div class="wrap">
    <div class="booking">
      <div>
        <span class="eyebrow">Book your free consultation</span>
        <h2>Let's map your systems — no cost, no obligation.</h2>
        <p>Pick a time below. We'll walk through your current setup and show you exactly
